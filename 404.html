<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — DJ Ton B.K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,206,201,0.04), transparent 70%);
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, #00cec9 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 8px;
        }
        .error-sub {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 24px;
        }
        .error-text {
            font-size: 15px;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #00cec9, #009e9a);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,206,201,0.3);
        }
        .equalizer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            z-index: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            padding: 0 10%;
            opacity: 0.15;
        }
        .eq-bar {
            flex: 1;
            max-width: 6px;
            background: linear-gradient(to top, transparent, #00cec9);
            border-radius: 2px 2px 0 0;
            transform-origin: bottom;
            animation: wiggle ease-in-out infinite alternate;
        }
        @keyframes wiggle {
            0% { transform: scaleY(0.1); }
            100% { transform: scaleY(1); }
        }
        @media (max-width: 480px) {
            .error-code { font-size: 80px; }
        }
    </style>
</head>
<body>
    <div class="equalizer" aria-hidden="true"></div>

    <div class="content">
        <div class="error-code">404</div>
        <div class="error-sub">Página não encontrada</div>
        <p class="error-text">O som parou por aqui... Essa página não existe ou foi removida. Vamos voltar ao palco principal?</p>
        <a href="/" class="btn">Voltar ao Início</a>
    </div>

    <script>
        const eq = document.querySelector('.equalizer');
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'eq-bar';
            bar.style.animationDuration = (0.5 + Math.random() * 1.2) + 's';
            bar.style.animationDelay = (Math.random() * 2) + 's';
            eq.appendChild(bar);
        }
    </script>
</body>
</html>
